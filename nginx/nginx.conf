upstream hello_django {
    server web:8000;
}

# Search response cache.
# keys_zone=search_cache:4m  — 4 MB of shared memory for cache keys (~32k entries).
# max_size=100m              — cap total disk usage for cached bodies at 100 MB.
# inactive=2h                — evict entries not requested for 2 hours.
# use_temp_path=off          — write directly to the cache path, skipping a temp copy.
proxy_cache_path /tmp/nginx_search_cache
    levels=1:2
    keys_zone=search_cache:4m
    max_size=100m
    inactive=2h
    use_temp_path=off;

server {

    listen 80;

    location / {
        proxy_pass http://hello_django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Search autocomplete — cached aggressively because the archive is static.
    location /search/ {
        proxy_pass http://hello_django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        proxy_cache            search_cache;
        proxy_cache_valid      200 1h;
        # Cache key includes the full query string so ?q=AI and ?q=robot are
        # stored as separate entries.
        proxy_cache_key        "$uri$is_args$args";
        # If Django is temporarily unreachable, serve the stale cached response
        # rather than returning a 502 to the user.
        proxy_cache_use_stale  error timeout updating http_503;
        # Collapse simultaneous cold-cache requests for the same query into one
        # upstream hit — the rest wait and are served from cache.
        proxy_cache_lock       on;

        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=3600";
    }

    location /static/ {
        alias /home/app/web/staticfiles/;
    }

    location /media/ {
        alias /home/app/web/mediafiles/;
    }

}
